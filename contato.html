<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Meu Site - Contato</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>Fale Conosco</h1>
		<nav>
			<ul>
				<li><a href="index.html">Home</a></li>
				<li><a href="sobre.html">Sobre</a></li>
				<li><a href="contato.html">Contato</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<section>
			<h2>Formulário de Contato</h2>
			<form action="#" method="post">
				<div>
					<label for="nome">Nome:</label>
					<input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
				</div>

				<div>
					<label for="email">E-mail:</label>
					<input type="email" id="email" name="email" placeholder="seuemail@dominio.com" required>
				</div>

				<div>
					<label for="telefone">Telefone:</label>
					<input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999">
				</div>

				<div>
					<label for="mensagem">Mensagem:</label>
					<textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
				</div>

				<button type="submit">Enviar</button>
			</form>
		</section>
	</main>

	<footer>
		<p>&copy; 2026 Meu Site. Todos os direitos reservados.</p>
	</footer>
</body>
</html>
